## Spotpear Ball v2 — ESP32-S3-N16R8 + ES8311 codec + GC9A01A 1.28" 240x240
## Home Assistant Voice Assistant (Assist pipeline)

substitutions:
  name: voice-assistant-ball-v2
  friendly_name: Voice Assistant Ball

  voice_assist_idle_phase_id:       "1"
  voice_assist_listening_phase_id:  "2"
  voice_assist_thinking_phase_id:   "3"
  voice_assist_replying_phase_id:   "4"
  voice_assist_not_ready_phase_id: "10"
  voice_assist_error_phase_id:     "11"
  voice_assist_muted_phase_id:     "12"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.5.0
  on_boot:
    priority: -100
    then:
      - switch.turn_on: speaker_enable
      - light.turn_on:
          id: Sled
          brightness: 100%
      - script.execute: draw_display
      # ES8311 anti-pop: set output resistance to max during transitions
      - lambda: |-
          uint8_t val = 0x00;
          i2c::I2CDevice dev;
          dev.set_i2c_bus(bus_a);
          dev.set_i2c_address(0x18);
          dev.write_register(0x45, &val, 1);  // DAC power-down control

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: "fallback123"
  on_connect:
    - script.execute: draw_display
  on_disconnect:
    - script.execute: draw_display

captive_portal:

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  on_client_connected:
    - script.execute: draw_display
  on_client_disconnected:
    - script.execute: draw_display

ota:
  - platform: esphome

globals:
  - id: init_in_progress
    type: bool
    restore_value: false
    initial_value: "true"
  - id: voice_assistant_phase
    type: int
    restore_value: false
    initial_value: "${voice_assist_not_ready_phase_id}"
  - id: stt_text
    type: std::string
    restore_value: false
    initial_value: '""'

# -------------------------------------------------------
# I2C — ES8311 codec control
# -------------------------------------------------------
i2c:
  - id: bus_a
    sda: GPIO15
    scl: GPIO14
    scan: true

# -------------------------------------------------------
# SPI bus — display
# -------------------------------------------------------
spi:
  - id: spi_bus
    clk_pin: GPIO4
    mosi_pin: GPIO2

# -------------------------------------------------------
# I2S — shared bus for ES8311 (mic + speaker)
# -------------------------------------------------------
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO9
    i2s_mclk_pin: GPIO16

# -------------------------------------------------------
# ES8311 codec
# -------------------------------------------------------
audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 12dB

# -------------------------------------------------------
# Microphone + Speaker via ES8311
# -------------------------------------------------------
microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO10
    adc_type: external
    channel: left
    pdm: false
    sample_rate: 16000
    bits_per_sample: 16bit

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO8
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 48000
    channel: mono

  - platform: mixer
    id: mixing_speaker
    output_speaker: spk
    num_channels: 1
    source_speakers:
      - id: announcement_mixer_input
      - id: silence_mixer_input

  - platform: resampler
    id: announcement_resampling_input
    output_speaker: announcement_mixer_input
    sample_rate: 48000

  - platform: resampler
    id: silence_resampling_input
    output_speaker: silence_mixer_input
    sample_rate: 48000

# -------------------------------------------------------
# Speaker enable GPIO46 + Backlight GPIO42 + WS2812 GPIO48
# -------------------------------------------------------
switch:
  - platform: gpio
    id: speaker_enable
    name: Speaker Enable
    pin: GPIO46
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    icon: "mdi:speaker"

  - platform: template
    name: Mute
    id: mute
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - microphone.mute:
      - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
      - script.execute: draw_display
    on_turn_off:
      - microphone.unmute:
      - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
      - script.execute: draw_display

output:
  - platform: ledc
    pin: GPIO42
    id: backlight_output
    inverted: true

light:
  - platform: monochromatic
    id: Sled
    name: Screen
    output: backlight_output
    restore_mode: ALWAYS_ON
    entity_category: config
    default_transition_length: 250ms

  - platform: esp32_rmt_led_strip
    id: led
    name: Status LED
    pin: GPIO48
    chipset: WS2812
    num_leds: 1
    rgb_order: grb
    default_transition_length: 0s
    entity_category: config
    effects:
      - pulse:
          name: pulse_slow
          transition_length: 250ms
          update_interval: 250ms
      - pulse:
          name: pulse_fast
          transition_length: 100ms
          update_interval: 100ms

# -------------------------------------------------------
# Media player
# -------------------------------------------------------
media_player:
  - platform: speaker
    name: Media Player
    id: mp
    announcement_pipeline:
      speaker: announcement_resampling_input
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    buffer_size: 250000
    on_announcement:
      - if:
          condition:
            - microphone.is_capturing:
          then:
            - script.execute: stop_wake_word
    on_idle:
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - script.execute: start_wake_word
            - script.execute: set_idle_or_mute_phase
            - script.execute: draw_display

# -------------------------------------------------------
# Wake word
# -------------------------------------------------------
micro_wake_word:
  id: mww
  models:
    - model: okay_nabu
      probability_cutoff: 0.92
      sliding_window_size: 15
    - model: hey_jarvis
      probability_cutoff: 0.92
      sliding_window_size: 15
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

# -------------------------------------------------------
# Voice Assistant
# -------------------------------------------------------
voice_assistant:
  id: va
  microphone: mic
  media_player: mp
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 4.0

  on_listening:
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_phase_id};
    - script.execute: draw_display
    - light.turn_on:
        id: led
        blue: 100%
        red: 0%
        green: 0%
        brightness: 60%
        effect: pulse_slow

  on_stt_end:
    - lambda: id(stt_text) = x;
    - script.execute: draw_display

  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: draw_display
    - light.turn_on:
        id: led
        blue: 100%
        red: 0%
        green: 0%
        brightness: 80%
        effect: pulse_fast

  on_tts_start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
    - script.execute: draw_display
    - light.turn_on:
        id: led
        blue: 100%
        red: 0%
        green: 0%
        brightness: 100%
        effect: none

  on_end:
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        condition:
          - and:
              - not:
                  media_player.is_announcing:
              - not:
                  speaker.is_playing:
                    id: spk
        timeout: 60s
    - if:
        condition:
          - lambda: return id(wake_word_engine_location).current_option() == "On device";
        then:
          - lambda: id(va).set_use_wake_word(false);
          - micro_wake_word.start:
    - lambda: id(stt_text) = "";
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display
    - light.turn_off: led

  on_error:
    - if:
        condition:
          lambda: return !id(init_in_progress);
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: draw_display
          - light.turn_on:
              id: led
              red: 100%
              green: 0%
              blue: 0%
              brightness: 100%
              effect: none
          - delay: 2s
          - light.turn_off: led
          - script.execute: set_idle_or_mute_phase
          - script.execute: draw_display

  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - script.execute: start_wake_word
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display

  on_client_disconnected:
    - script.execute: stop_wake_word
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: draw_display

# -------------------------------------------------------
# Wake word engine selector
# -------------------------------------------------------
select:
  - platform: template
    name: Wake Word Engine
    id: wake_word_engine_location
    icon: "mdi:account-voice"
    optimistic: true
    restore_value: true
    options:
      - In Home Assistant
      - On device
    initial_option: On device
    entity_category: config
    on_value:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - if:
                condition:
                  lambda: return x == "In Home Assistant";
                then:
                  - micro_wake_word.stop:
                  - delay: 500ms
                  - if:
                      condition:
                        switch.is_off: mute
                      then:
                        - lambda: id(va).set_use_wake_word(true);
                        - voice_assistant.start_continuous:
            - if:
                condition:
                  lambda: return x == "On device";
                then:
                  - lambda: id(va).set_use_wake_word(false);
                  - voice_assistant.stop:
                  - delay: 500ms
                  - if:
                      condition:
                        switch.is_off: mute
                      then:
                        - micro_wake_word.start:

# -------------------------------------------------------
# Boot button — push to talk
# -------------------------------------------------------
button:
  - platform: factory_reset
    id: factory_reset_btn
    internal: true

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      ignore_strapping_warning: true
      inverted: true
    id: boot_button
    internal: true
    on_multi_click:
      - timing:
          - ON for at least 50ms
          - OFF for at least 50ms
        then:
          - if:
              condition:
                switch.is_on: mute
              then:
                - switch.turn_off: mute
              else:
                - if:
                    condition:
                      not:
                        voice_assistant.is_running:
                    then:
                      - voice_assistant.start:
                    else:
                      - voice_assistant.stop:
      - timing:
          - ON for at least 10s
        then:
          - button.press: factory_reset_btn

# -------------------------------------------------------
# Battery sensor
# -------------------------------------------------------
sensor:
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    attenuation: 12db
    accuracy_decimals: 2
    unit_of_measurement: "V"
    icon: mdi:battery-medium
    update_interval: 60s
    filters:
      - multiply: 2.0
      - median:
          window_size: 7
          send_every: 7
          send_first_at: 1

# -------------------------------------------------------
# Display — GC9A01A 1.28" 240x240 round
# -------------------------------------------------------
font:
  - file: "gfonts://Roboto"
    id: font_large
    size: 30
  - file: "gfonts://Roboto"
    id: font_small
    size: 16

display:
  - platform: mipi_spi
    id: lcd
    model: GC9A01A
    invert_colors: true
    cs_pin: GPIO5
    dc_pin: GPIO47
    reset_pin: GPIO38
    update_interval: never
    pages:
      - id: page_initializing
        lambda: |-
          it.fill(Color::BLACK);
          it.print(120, 100, id(font_large), Color(200,200,200), TextAlign::CENTER, "Starting...");
      - id: page_no_wifi
        lambda: |-
          it.fill(Color::BLACK);
          it.print(120, 110, id(font_large), Color(255,100,0), TextAlign::CENTER, "No WiFi");
      - id: page_no_ha
        lambda: |-
          it.fill(Color::BLACK);
          it.print(120, 90,  id(font_large), Color(255,100,0),   TextAlign::CENTER, "No HA");
          it.print(120, 130, id(font_small), Color(150,150,150), TextAlign::CENTER, "Connecting...");
      - id: page_idle
        lambda: |-
          it.fill(Color::BLACK);
          it.print(120, 90,  id(font_large), Color(255,255,255), TextAlign::CENTER, "Ready");
          it.print(120, 130, id(font_small), Color(100,100,100), TextAlign::CENTER, "Say OK Nabu");
      - id: page_listening
        lambda: |-
          it.fill(Color::BLACK);
          it.print(120, 110, id(font_large), Color(0,150,255), TextAlign::CENTER, "Listening");
      - id: page_thinking
        lambda: |-
          it.fill(Color::BLACK);
          it.print(120, 75, id(font_large), Color(255,200,0), TextAlign::CENTER, "Thinking...");
          if (!id(stt_text).empty()) {
            std::string t = id(stt_text);
            if (t.length() > 22) t = t.substr(0, 20) + "..";
            it.print(120, 135, id(font_small), Color(200,200,200), TextAlign::CENTER, t.c_str());
          }
      - id: page_replying
        lambda: |-
          it.fill(Color::BLACK);
          it.print(120, 75, id(font_large), Color(0,220,100), TextAlign::CENTER, "Speaking");
          if (!id(stt_text).empty()) {
            std::string t = id(stt_text);
            if (t.length() > 22) t = t.substr(0, 20) + "..";
            it.print(120, 135, id(font_small), Color(200,200,200), TextAlign::CENTER, t.c_str());
          }
      - id: page_error
        lambda: |-
          it.fill(Color::BLACK);
          it.print(120, 110, id(font_large), Color(255,50,50), TextAlign::CENTER, "Error");
      - id: page_muted
        lambda: |-
          it.fill(Color::BLACK);
          it.print(120, 110, id(font_large), Color(150,150,150), TextAlign::CENTER, "Muted");

# -------------------------------------------------------
# Scripts
# -------------------------------------------------------
script:
  - id: draw_display
    then:
      - if:
          condition:
            lambda: return id(init_in_progress);
          then:
            - display.page.show: page_initializing
            - component.update: lcd
          else:
            - if:
                condition:
                  not:
                    wifi.connected:
                then:
                  - display.page.show: page_no_wifi
                  - component.update: lcd
                else:
                  - if:
                      condition:
                        not:
                          api.connected:
                      then:
                        - display.page.show: page_no_ha
                        - component.update: lcd
                      else:
                        - lambda: |-
                            switch (id(voice_assistant_phase)) {
                              case ${voice_assist_listening_phase_id}:
                                id(lcd).show_page(page_listening); break;
                              case ${voice_assist_thinking_phase_id}:
                                id(lcd).show_page(page_thinking); break;
                              case ${voice_assist_replying_phase_id}:
                                id(lcd).show_page(page_replying); break;
                              case ${voice_assist_error_phase_id}:
                                id(lcd).show_page(page_error); break;
                              case ${voice_assist_muted_phase_id}:
                                id(lcd).show_page(page_muted); break;
                              case ${voice_assist_not_ready_phase_id}:
                                id(lcd).show_page(page_no_ha); break;
                              default:
                                id(lcd).show_page(page_idle); break;
                            }
                        - component.update: lcd

  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start_continuous:

  - id: stop_wake_word
    then:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - micro_wake_word.stop:

  - id: set_idle_or_mute_phase
    then:
      - if:
          condition:
            switch.is_off: mute
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
          else:
            - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
