## Spotpear Ball v2 — ESP32-S3-N16R8 + ES8311 codec + GC9A01A 1.28" 240x240
## Home Assistant Voice Assistant (Assist pipeline)

substitutions:
  name: voice-assistant-ball-v2
  friendly_name: Voice Assistant Ball

  voice_assist_idle_phase_id:       "1"
  voice_assist_listening_phase_id:  "2"
  voice_assist_thinking_phase_id:   "3"
  voice_assist_replying_phase_id:   "4"
  voice_assist_not_ready_phase_id: "10"
  voice_assist_error_phase_id:     "11"
  voice_assist_muted_phase_id:     "12"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.5.0
  on_boot:
    priority: -100
    then:
      - switch.turn_on: speaker_enable
      - light.turn_on:
          id: Sled
          brightness: 100%
      - script.execute: draw_display
      # ES8311 anti-pop: set output resistance to max during transitions
      - lambda: |-
          uint8_t val = 0x00;
          i2c::I2CDevice dev;
          dev.set_i2c_bus(bus_a);
          dev.set_i2c_address(0x18);
          dev.write_register(0x45, &val, 1);  // DAC power-down control

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: "fallback123"
  on_connect:
    - script.execute: draw_display
  on_disconnect:
    - script.execute: draw_display

captive_portal:

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  on_client_connected:
    - script.execute: draw_display
  on_client_disconnected:
    - script.execute: draw_display

ota:
  - platform: esphome

globals:
  - id: init_in_progress
    type: bool
    restore_value: false
    initial_value: "true"
  - id: voice_assistant_phase
    type: int
    restore_value: false
    initial_value: "${voice_assist_not_ready_phase_id}"
  - id: stt_text
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: anim_frame
    type: int
    restore_value: false
    initial_value: "0"
  - id: stt_retry_count
    type: int
    restore_value: false
    initial_value: "0"

# -------------------------------------------------------
# I2C — ES8311 codec control
# -------------------------------------------------------
i2c:
  - id: bus_a
    sda: GPIO15
    scl: GPIO14
    scan: true

# -------------------------------------------------------
# SPI bus — display
# -------------------------------------------------------
spi:
  - id: spi_bus
    clk_pin: GPIO4
    mosi_pin: GPIO2

# -------------------------------------------------------
# I2S — shared bus for ES8311 (mic + speaker)
# -------------------------------------------------------
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO9
    i2s_mclk_pin: GPIO16

# -------------------------------------------------------
# ES8311 codec
# -------------------------------------------------------
audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 42dB

# -------------------------------------------------------
# Microphone + Speaker via ES8311
# -------------------------------------------------------
microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO10
    adc_type: external
    channel: left
    pdm: false
    sample_rate: 16000
    bits_per_sample: 16bit

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO8
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 48000
    channel: mono

  - platform: mixer
    id: mixing_speaker
    output_speaker: spk
    num_channels: 1
    source_speakers:
      - id: announcement_mixer_input
      - id: silence_mixer_input

  - platform: resampler
    id: announcement_resampling_input
    output_speaker: announcement_mixer_input
    sample_rate: 48000

  - platform: resampler
    id: silence_resampling_input
    output_speaker: silence_mixer_input
    sample_rate: 48000

# -------------------------------------------------------
# Speaker enable GPIO46 + Backlight GPIO42 + WS2812 GPIO48
# -------------------------------------------------------
switch:
  - platform: gpio
    id: speaker_enable
    name: Speaker Enable
    pin: GPIO46
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    icon: "mdi:speaker"

  - platform: template
    name: Mute
    id: mute
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - microphone.mute:
      - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
      - script.execute: draw_display
    on_turn_off:
      - microphone.unmute:
      - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
      - script.execute: draw_display

output:
  - platform: ledc
    pin: GPIO42
    id: backlight_output
    inverted: true

light:
  - platform: monochromatic
    id: Sled
    name: Screen
    output: backlight_output
    restore_mode: ALWAYS_ON
    entity_category: config
    default_transition_length: 250ms

  - platform: esp32_rmt_led_strip
    id: led
    name: Status LED
    pin: GPIO48
    chipset: WS2812
    num_leds: 1
    rgb_order: grb
    default_transition_length: 0s
    entity_category: config
    effects:
      - pulse:
          name: pulse_slow
          transition_length: 250ms
          update_interval: 250ms
      - pulse:
          name: pulse_fast
          transition_length: 100ms
          update_interval: 100ms

# -------------------------------------------------------
# Media player
# -------------------------------------------------------
media_player:
  - platform: speaker
    name: Media Player
    id: mp
    announcement_pipeline:
      speaker: announcement_resampling_input
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    buffer_size: 250000
    on_announcement:
      - if:
          condition:
            - microphone.is_capturing:
          then:
            - script.execute: stop_wake_word
    on_idle:
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - script.execute: start_wake_word
            - script.execute: set_idle_or_mute_phase
            - script.execute: draw_display

# -------------------------------------------------------
# Animation interval
# -------------------------------------------------------
interval:
  - interval: 120ms
    then:
      - lambda: id(anim_frame) = (id(anim_frame) + 1) % 3600;
      - if:
          condition:
            or:
              - lambda: return id(voice_assistant_phase) == ${voice_assist_listening_phase_id};
              - lambda: return id(voice_assistant_phase) == ${voice_assist_thinking_phase_id};
              - lambda: return id(voice_assistant_phase) == ${voice_assist_replying_phase_id};
              - lambda: return (id(anim_frame) % 5 == 0) && (id(voice_assistant_phase) == ${voice_assist_idle_phase_id});
          then:
            - component.update: lcd

# -------------------------------------------------------
# Wake word
# -------------------------------------------------------
micro_wake_word:
  id: mww
  models:
    - model: okay_nabu
      probability_cutoff: 0.85
      sliding_window_size: 15
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

# -------------------------------------------------------
# Voice Assistant
# -------------------------------------------------------
voice_assistant:
  id: va
  microphone: mic
  media_player: mp
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 4.0

  on_listening:
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_phase_id};
    - script.execute: draw_display
    - light.turn_on:
        id: led
        blue: 100%
        red: 0%
        green: 0%
        brightness: 60%
        effect: pulse_slow

  on_stt_end:
    - lambda: |-
        id(stt_text) = x;
        id(stt_retry_count) = 0;
    - script.execute: draw_display

  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: draw_display
    - light.turn_on:
        id: led
        blue: 100%
        red: 0%
        green: 0%
        brightness: 80%
        effect: pulse_fast

  on_tts_start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
    - script.execute: draw_display
    - light.turn_on:
        id: led
        blue: 100%
        red: 0%
        green: 0%
        brightness: 100%
        effect: none

  on_end:
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        condition:
          - and:
              - not:
                  media_player.is_announcing:
              - not:
                  speaker.is_playing:
                    id: spk
        timeout: 60s
    - if:
        condition:
          - lambda: return id(wake_word_engine_location).current_option() == "On device";
        then:
          - lambda: id(va).set_use_wake_word(false);
          - micro_wake_word.start:
    - lambda: id(stt_text) = "";
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display
    - light.turn_off: led

  on_error:
    - if:
        condition:
          lambda: return !id(init_in_progress) && (code == "stt-no-text-recognized" || code == "intent-failed") && id(stt_retry_count) < 2;
        then:
          - lambda: id(stt_retry_count) += 1;
          - if:
              condition:
                lambda: return id(stt_retry_count) == 1;
              then:
                - homeassistant.service:
                    service: tts.speak
                    data:
                      entity_id: tts.piper
                      media_player_entity_id: media_player.voice_assistant_ball
                      message: "I didn't quite catch that. Please repeat."
              else:
                - homeassistant.service:
                    service: tts.speak
                    data:
                      entity_id: tts.piper
                      media_player_entity_id: media_player.voice_assistant_ball
                      message: "Sorry, one more time please."
          - delay: 3s
          - lambda: id(voice_assistant_phase) = ${voice_assist_listening_phase_id};
          - script.execute: draw_display
          - voice_assistant.start:
        else:
          - if:
              condition:
                lambda: return !id(init_in_progress);
              then:
                - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
                - script.execute: draw_display
                - light.turn_on:
                    id: led
                    red: 100%
                    green: 0%
                    blue: 0%
                    brightness: 100%
                    effect: none
                - delay: 2s
                - light.turn_off: led
                - script.execute: set_idle_or_mute_phase
                - script.execute: draw_display

  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - script.execute: start_wake_word
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display

  on_client_disconnected:
    - script.execute: stop_wake_word
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: draw_display

# -------------------------------------------------------
# Wake word engine selector
# -------------------------------------------------------
select:
  - platform: template
    name: Wake Word Engine
    id: wake_word_engine_location
    icon: "mdi:account-voice"
    optimistic: true
    restore_value: true
    options:
      - In Home Assistant
      - On device
    initial_option: On device
    entity_category: config
    on_value:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - if:
                condition:
                  lambda: return x == "In Home Assistant";
                then:
                  - micro_wake_word.stop:
                  - delay: 500ms
                  - if:
                      condition:
                        switch.is_off: mute
                      then:
                        - lambda: id(va).set_use_wake_word(true);
                        - voice_assistant.start_continuous:
            - if:
                condition:
                  lambda: return x == "On device";
                then:
                  - lambda: id(va).set_use_wake_word(false);
                  - voice_assistant.stop:
                  - delay: 500ms
                  - if:
                      condition:
                        switch.is_off: mute
                      then:
                        - micro_wake_word.start:

# -------------------------------------------------------
# Boot button — push to talk
# -------------------------------------------------------
button:
  - platform: factory_reset
    id: factory_reset_btn
    internal: true

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      ignore_strapping_warning: true
      inverted: true
    id: boot_button
    internal: true
    on_multi_click:
      - timing:
          - ON for at least 50ms
          - OFF for at least 50ms
        then:
          - if:
              condition:
                switch.is_on: mute
              then:
                - switch.turn_off: mute
              else:
                - if:
                    condition:
                      not:
                        voice_assistant.is_running:
                    then:
                      - voice_assistant.start:
                    else:
                      - voice_assistant.stop:
      - timing:
          - ON for at least 10s
        then:
          - button.press: factory_reset_btn

# -------------------------------------------------------
# Battery sensor
# -------------------------------------------------------
sensor:
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    attenuation: 12db
    accuracy_decimals: 2
    unit_of_measurement: "V"
    icon: mdi:battery-medium
    update_interval: 60s
    filters:
      - multiply: 2.0
      - median:
          window_size: 7
          send_every: 7
          send_first_at: 1

# -------------------------------------------------------
# Display — GC9A01A 1.28" 240x240 round
# -------------------------------------------------------
font:
  - file: "gfonts://Roboto"
    id: font_large
    size: 30
  - file: "gfonts://Roboto"
    id: font_medium
    size: 22
  - file: "gfonts://Roboto"
    id: font_small
    size: 14

display:
  - platform: mipi_spi
    id: lcd
    model: GC9A01A
    invert_colors: true
    cs_pin: GPIO5
    dc_pin: GPIO47
    reset_pin: GPIO38
    update_interval: never
    pages:
      - id: page_initializing
        lambda: |-
          it.fill(Color(3, 3, 10));
          it.circle(120, 120, 115, Color(30, 30, 55));
          int n = 24, head = (id(anim_frame) * 2) % n;
          for (int i = 0; i < 14; i++) {
            int pos = (head - i + n) % n;
            float ang = pos * (2.0f * 3.14159f / n);
            int x = 120 + (int)(88.0f * sinf(ang));
            int y = 120 - (int)(88.0f * cosf(ang));
            uint8_t b = (uint8_t)std::max(0, 220 - i * 15);
            it.filled_circle(x, y, 3, Color(b/5, b/5, b));
          }
          // Sleepy eyes shifting side to side
          int look = (id(anim_frame) / 25) % 3;
          int px = (look == 0) ? -3 : (look == 2 ? 3 : 0);
          it.filled_circle(85,  100, 11, Color(210, 210, 230));
          it.filled_circle(85 + px, 101, 5, Color(20, 20, 40));
          it.filled_circle(155, 100, 11, Color(210, 210, 230));
          it.filled_circle(155 + px, 101, 5, Color(20, 20, 40));
          it.filled_rectangle(107, 127, 26, 3, Color(160, 160, 185));

      - id: page_no_wifi
        lambda: |-
          it.fill(Color(10, 2, 2));
          it.circle(120, 120, 115, Color(100, 15, 15));
          it.circle(120, 120, 90,  Color(70,  10, 10));
          it.circle(120, 120, 65,  Color(45,   8,  8));
          // Sad eyebrows (angled down toward center)
          it.line(73, 85, 96, 91, Color(220, 70, 70));
          it.line(73, 86, 96, 92, Color(220, 70, 70));
          it.line(144, 91, 167, 85, Color(220, 70, 70));
          it.line(144, 92, 167, 86, Color(220, 70, 70));
          // Sad eyes (pupils down)
          it.filled_circle(85,  100, 12, Color(225, 195, 195));
          it.filled_circle(85,  104,  5, Color(60,  20,  20));
          it.filled_circle(155, 100, 12, Color(225, 195, 195));
          it.filled_circle(155, 104,  5, Color(60,  20,  20));
          // Frown
          for (int i = -24; i <= 24; i += 3) {
            float t = (float)i / 24.0f;
            int y = 135 - (int)(10.0f * (1.0f - t*t));
            it.filled_circle(120 + i, y, 2, Color(220, 70, 70));
          }

      - id: page_no_ha
        lambda: |-
          it.fill(Color(8, 6, 0));
          it.circle(120, 120, 115, Color(80, 50, 0));
          int n = 24, head = id(anim_frame) % n;
          for (int i = 0; i < 12; i++) {
            int pos = (head - i + n) % n;
            float ang = pos * (2.0f * 3.14159f / n);
            int x = 120 + (int)(93.0f * sinf(ang));
            int y = 120 - (int)(93.0f * cosf(ang));
            uint8_t b = (uint8_t)std::max(0, 220 - i * 18);
            it.filled_circle(x, y, 3, Color(b, b/2, 0));
          }
          // Confused eyebrows (one up, one down)
          it.line(73, 87, 96, 81, Color(200, 150, 30));
          it.line(73, 88, 96, 82, Color(200, 150, 30));
          it.line(144, 83, 167, 89, Color(200, 150, 30));
          it.line(144, 84, 167, 90, Color(200, 150, 30));
          // Normal eyes, one pupil shifted
          it.filled_circle(85,  100, 12, Color(225, 215, 175));
          it.filled_circle(85,  100,  5, Color(40,  30,  10));
          it.filled_circle(155, 100, 12, Color(225, 215, 175));
          it.filled_circle(158,  97,  5, Color(40,  30,  10));
          // Wavy confused mouth
          for (int i = -22; i <= 22; i += 4) {
            int y = 130 + (int)(5.0f * sinf((float)i * 0.25f));
            it.filled_circle(120 + i, y, 2, Color(200, 150, 30));
          }

      - id: page_idle
        lambda: |-
          it.fill(Color(3, 3, 10));
          // Outer breathing glow
          float br = 0.5f + 0.5f * sinf(id(anim_frame) * 0.06f);
          int ring_r = 92 + (int)(14.0f * br);
          uint8_t rb = (uint8_t)(18 + 25 * br);
          it.circle(120, 120, ring_r,     Color(rb/4, rb/4, rb));
          it.circle(120, 120, ring_r - 1, Color(rb/6, rb/6, rb/2));
          it.circle(120, 120, 115, Color(14, 14, 26));
          // Ambient floating particles
          for (int p = 0; p < 5; p++) {
            float ph = p * 1.2566f;
            float ag = ph + id(anim_frame) * 0.004f;
            float ob = 50.0f + 10.0f * sinf(ph * 1.5f);
            int ppx = 120 + (int)(ob * cosf(ag));
            int ppy = 120 + (int)(ob * sinf(ag));
            uint8_t pb = (uint8_t)(12 + 12 * sinf(ag + ph));
            it.filled_circle(ppx, ppy, 1, Color(pb/3, pb/3, pb));
          }
          // Eyebrows (relaxed, gentle arch)
          it.line(73, 81, 96, 78, Color(150, 150, 175));
          it.line(73, 82, 96, 79, Color(150, 150, 175));
          it.line(144, 78, 167, 81, Color(150, 150, 175));
          it.line(144, 79, 167, 82, Color(150, 150, 175));
          // Eyes with periodic blink
          int bl = id(anim_frame) % 70;
          it.filled_circle(85, 100, 13, Color(235, 235, 245));
          if (bl < 66) {
            it.filled_circle(86, 101, 6, Color(20, 20, 40));
            it.filled_circle(90, 97,  2, Color(255, 255, 255));
          } else {
            it.filled_rectangle(72, 99, 26, 3, Color(235, 235, 245));
          }
          it.filled_circle(155, 100, 13, Color(235, 235, 245));
          if (bl < 66) {
            it.filled_circle(156, 101, 6, Color(20, 20, 40));
            it.filled_circle(160, 97,  2, Color(255, 255, 255));
          } else {
            it.filled_rectangle(142, 99, 26, 3, Color(235, 235, 245));
          }
          // Gentle smile
          for (int i = -26; i <= 26; i += 3) {
            float t = (float)i / 26.0f;
            int y = 128 + (int)(8.0f * (1.0f - t*t));
            it.filled_circle(120 + i, y, 2, Color(185, 185, 215));
          }

      - id: page_listening
        lambda: |-
          it.fill(Color(0, 4, 16));
          it.circle(120, 120, 116, Color(0, 75, 165));
          // Sonar rings expanding outward
          for (int w = 0; w < 3; w++) {
            int r = (id(anim_frame) * 2 + w * 32) % 95 + 15;
            uint8_t a = (uint8_t)std::max(0, 240 - r * 2);
            if (a > 20) it.circle(120, 120, r, Color(0, a * 2/3, a));
          }
          // Rotating blue comet
          int n = 36, head = (id(anim_frame) * 3) % n;
          for (int i = 0; i < 22; i++) {
            int pos = (head - i + n) % n;
            float ang = pos * (2.0f * 3.14159f / n);
            int x = 120 + (int)(98.0f * sinf(ang));
            int y = 120 - (int)(98.0f * cosf(ang));
            uint8_t b = (uint8_t)std::max(30, 255 - i * 10);
            it.filled_circle(x, y, 3, Color(0, b * 2/3, b));
          }
          // Raised alert eyebrows
          it.line(73, 74, 96, 69, Color(140, 195, 255));
          it.line(73, 75, 96, 70, Color(140, 195, 255));
          it.line(144, 69, 167, 74, Color(140, 195, 255));
          it.line(144, 70, 167, 75, Color(140, 195, 255));
          // Wide alert eyes
          it.filled_circle(85,  100, 14, Color(230, 238, 255));
          it.filled_circle(86,  101,  7, Color(10,  10,  50));
          it.filled_circle(91,  96,   2, Color(255, 255, 255));
          it.filled_circle(155, 100, 14, Color(230, 238, 255));
          it.filled_circle(156, 101,  7, Color(10,  10,  50));
          it.filled_circle(161, 96,   2, Color(255, 255, 255));
          // Slightly open mouth
          it.filled_circle(120, 130, 8, Color(15, 15, 40));
          it.circle(120, 130, 9, Color(180, 215, 255));

      - id: page_thinking
        lambda: |-
          it.fill(Color(10, 8, 0));
          it.circle(120, 120, 116, Color(90, 58, 0));
          // Fast amber comet
          int n = 36, head = (id(anim_frame) * 4) % n;
          for (int i = 0; i < 22; i++) {
            int pos = (head - i + n) % n;
            float ang = pos * (2.0f * 3.14159f / n);
            int x = 120 + (int)(95.0f * sinf(ang));
            int y = 120 - (int)(95.0f * cosf(ang));
            uint8_t b = (uint8_t)std::max(25, 255 - i * 10);
            it.filled_circle(x, y, 3, Color(b, b * 2/3, 0));
          }
          // Asymmetric eyebrows — left raised (thinking)
          it.line(73, 74, 96, 80, Color(195, 155, 25));
          it.line(73, 75, 96, 81, Color(195, 155, 25));
          it.line(144, 82, 167, 78, Color(195, 155, 25));
          it.line(144, 83, 167, 79, Color(195, 155, 25));
          // Thinking eyes — pupils shifted up-right
          it.filled_circle(85,  100, 12, Color(228, 222, 195));
          it.filled_circle(88,   96,  5, Color(30,  25,   0));
          it.filled_circle(91,   93,  2, Color(255, 255, 200));
          it.filled_circle(155, 100, 12, Color(228, 222, 195));
          it.filled_circle(158,  96,  5, Color(30,  25,   0));
          it.filled_circle(161,  93,  2, Color(255, 255, 200));
          // Neutral mouth
          it.filled_rectangle(104, 128, 32, 3, Color(195, 155, 25));
          // Three pulsing thinking dots
          float dt = id(anim_frame) * 0.25f;
          uint8_t da = (uint8_t)(80 + 80 * sinf(dt));
          uint8_t db2 = (uint8_t)(80 + 80 * sinf(dt + 1.05f));
          uint8_t dc = (uint8_t)(80 + 80 * sinf(dt + 2.1f));
          it.filled_circle(104, 148, 5, Color(da,  da  * 2/3, 0));
          it.filled_circle(120, 148, 5, Color(db2, db2 * 2/3, 0));
          it.filled_circle(136, 148, 5, Color(dc,  dc  * 2/3, 0));
          // STT text — what was heard
          std::string stt = id(stt_text);
          if (!stt.empty()) {
            if (stt.length() <= 14) {
              it.print(120, 168, id(font_medium), Color(255, 210, 75), TextAlign::CENTER, stt.c_str());
            } else {
              size_t sp = stt.rfind(' ', 14);
              if (sp == std::string::npos) sp = 14;
              std::string l1 = stt.substr(0, sp);
              std::string l2 = stt.substr(stt[sp] == ' ' ? sp+1 : sp);
              if (l2.length() > 14) l2 = l2.substr(0, 12) + "..";
              it.print(120, 160, id(font_medium), Color(255, 210, 75), TextAlign::CENTER, l1.c_str());
              it.print(120, 184, id(font_medium), Color(255, 210, 75), TextAlign::CENTER, l2.c_str());
            }
          }

      - id: page_replying
        lambda: |-
          it.fill(Color(0, 8, 4));
          it.circle(120, 120, 116, Color(0, 78, 40));
          // Pulsing green rings
          float at = id(anim_frame) * 0.18f;
          it.circle(120, 120, (int)(42 + 10*sinf(at)),        Color(0, 200, 95));
          it.circle(120, 120, (int)(60 + 10*sinf(at + 1.1f)), Color(0, 155, 70));
          it.circle(120, 120, (int)(78 + 10*sinf(at + 2.2f)), Color(0, 108, 50));
          // Happy eyebrows (angled up at outer edge)
          it.line(73, 82, 96, 77, Color(95, 235, 145));
          it.line(73, 83, 96, 78, Color(95, 235, 145));
          it.line(144, 77, 167, 82, Color(95, 235, 145));
          it.line(144, 78, 167, 83, Color(95, 235, 145));
          // Happy squint eyes (half-circle D shape)
          it.filled_circle(85,  100, 13, Color(215, 255, 225));
          it.filled_rectangle(72,  87, 26, 13, Color(0, 8, 4));
          it.filled_circle(155, 100, 13, Color(215, 255, 225));
          it.filled_rectangle(142, 87, 26, 13, Color(0, 8, 4));
          // Animated talking mouth
          int tp = (id(anim_frame) * 2) % 8;
          int mo = (tp < 4) ? tp : (7 - tp);
          it.filled_circle(120, 131, 5 + mo * 3, Color(15, 38, 22));
          it.circle(120, 131, 6 + mo * 3, Color(95, 235, 145));
          // STT text
          std::string stt = id(stt_text);
          if (!stt.empty()) {
            if (stt.length() <= 14) {
              it.print(120, 168, id(font_medium), Color(135, 255, 165), TextAlign::CENTER, stt.c_str());
            } else {
              size_t sp = stt.rfind(' ', 14);
              if (sp == std::string::npos) sp = 14;
              std::string l1 = stt.substr(0, sp);
              std::string l2 = stt.substr(stt[sp] == ' ' ? sp+1 : sp);
              if (l2.length() > 14) l2 = l2.substr(0, 12) + "..";
              it.print(120, 160, id(font_medium), Color(135, 255, 165), TextAlign::CENTER, l1.c_str());
              it.print(120, 184, id(font_medium), Color(135, 255, 165), TextAlign::CENTER, l2.c_str());
            }
          }

      - id: page_error
        lambda: |-
          it.fill(Color(10, 2, 2));
          it.circle(120, 120, 116, Color(125, 18, 18));
          it.circle(120, 120, 85,  Color(85,  12, 12));
          // X eyes
          it.line(79, 91, 91, 109, Color(255, 50, 50));
          it.line(91, 91, 79, 109, Color(255, 50, 50));
          it.line(80, 91, 92, 109, Color(255, 50, 50));
          it.line(92, 91, 80, 109, Color(255, 50, 50));
          it.line(149, 91, 161, 109, Color(255, 50, 50));
          it.line(161, 91, 149, 109, Color(255, 50, 50));
          it.line(150, 91, 162, 109, Color(255, 50, 50));
          it.line(162, 91, 150, 109, Color(255, 50, 50));
          // Frown
          for (int i = -24; i <= 24; i += 3) {
            float t = (float)i / 24.0f;
            int y = 135 - (int)(10.0f * (1.0f - t*t));
            it.filled_circle(120 + i, y, 2, Color(255, 50, 50));
          }

      - id: page_muted
        lambda: |-
          it.fill(Color(8, 8, 10));
          it.circle(120, 120, 116, Color(42, 42, 52));
          it.circle(120, 120, 85,  Color(28, 28, 38));
          // Closed eyes (flat lines)
          it.filled_rectangle(73,  99, 24, 3, Color(155, 155, 175));
          it.filled_rectangle(143, 99, 24, 3, Color(155, 155, 175));
          // Neutral eyebrows
          it.line(73, 84, 96, 84, Color(100, 100, 120));
          it.line(144, 84, 167, 84, Color(100, 100, 120));
          // Mouth with zip stitch marks
          it.filled_rectangle(94, 128, 52, 3, Color(115, 115, 135));
          for (int i = 0; i <= 5; i++) {
            it.line(98 + i*9, 125, 98 + i*9, 132, Color(70, 70, 90));
          }

# -------------------------------------------------------
# Scripts
# -------------------------------------------------------
script:
  - id: draw_display
    then:
      - if:
          condition:
            lambda: return id(init_in_progress);
          then:
            - display.page.show: page_initializing
            - component.update: lcd
          else:
            - if:
                condition:
                  not:
                    wifi.connected:
                then:
                  - display.page.show: page_no_wifi
                  - component.update: lcd
                else:
                  - if:
                      condition:
                        not:
                          api.connected:
                      then:
                        - display.page.show: page_no_ha
                        - component.update: lcd
                      else:
                        - lambda: |-
                            switch (id(voice_assistant_phase)) {
                              case ${voice_assist_listening_phase_id}:
                                id(lcd).show_page(page_listening); break;
                              case ${voice_assist_thinking_phase_id}:
                                id(lcd).show_page(page_thinking); break;
                              case ${voice_assist_replying_phase_id}:
                                id(lcd).show_page(page_replying); break;
                              case ${voice_assist_error_phase_id}:
                                id(lcd).show_page(page_error); break;
                              case ${voice_assist_muted_phase_id}:
                                id(lcd).show_page(page_muted); break;
                              case ${voice_assist_not_ready_phase_id}:
                                id(lcd).show_page(page_no_ha); break;
                              default:
                                id(lcd).show_page(page_idle); break;
                            }
                        - component.update: lcd

  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start_continuous:

  - id: stop_wake_word
    then:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - micro_wake_word.stop:

  - id: set_idle_or_mute_phase
    then:
      - if:
          condition:
            switch.is_off: mute
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
          else:
            - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
